name: Bug report
description: Something is broken or misbehaving
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill in the details below so the
        issue can be reproduced and fixed quickly.
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version from package.json, or the commit SHA
      placeholder: "1.3.0"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: Where does the bug reproduce?
      options:
        - Node.js 18
        - Node.js 20
        - Node.js 22+
        - Bun
        - Both Node.js and Bun
      default: 4
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the exact error message and stack trace.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code that reproduces the issue.
      render: typescript
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this bug
        - label: I can reproduce on the latest release
        - label: I checked that my config is valid per the module docs
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities must **not** be reported here — see
        [SECURITY.md](../../SECURITY.md) for the private reporting process.